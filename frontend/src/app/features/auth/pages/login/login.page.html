<main class="login-shell">
  <section class="login-panel">
    <div class="brand-block">
      <div class="brand-mark">RH</div>
      <div>
        <p class="eyebrow">ReserveHub</p>
        <h1>Acceso al sistema</h1>
      </div>
    </div>

    <p class="lead">Inicia sesión con las credenciales de tu cuenta.</p>

    <form class="login-form" (ngSubmit)="submit()">
      <label>Correo electrónico<input type="email" name="email" autocomplete="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required /></label>
      <label>Contraseña<input type="password" name="password" autocomplete="current-password" [ngModel]="password()" (ngModelChange)="password.set($event)" required /></label>
      @if (error(); as errorMessage) { <p class="login-error" role="alert">{{ errorMessage }}</p> }
      <button class="login-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="demo-section">
      <div class="demo-heading"><span>Demo accounts</span><small>Selecciona una para rellenar el formulario</small></div>
      <div class="account-grid" role="list">
      @for (account of demoAccounts; track account.role) {
        <button
          type="button"
          class="account-card"
          (click)="useDemoAccount(account)"
        >
          <div class="account-header">
            @if (account.role === 'ADMIN') {
              <svg lucideShieldCheck [size]="18" aria-hidden="true"></svg>
            } @else {
              <svg lucideUsersRound [size]="18" aria-hidden="true"></svg>
            }
            <span>{{ account.title }}</span>
          </div>
          <strong>{{ account.name }}</strong>
          <small>{{ account.email }}</small>
          <small>Password: {{ account.password }}</small>
          <p>{{ account.description }}</p>
        </button>
      }
      </div>
    </div>
    <a class="register-link" routerLink="/register">Crear una cuenta</a>
  </section>
</main>
